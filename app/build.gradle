plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yixiu.photo'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.yixiu.photo"
        minSdk 26
        targetSdk 35
    // 版本号唯一来源：根目录 version.properties；发版可用 -PversionName/-PversionCode 临时覆盖
    def versionProps = new Properties()
    def versionFile = rootProject.file('version.properties')
    if (versionFile.exists()) {
        versionFile.withInputStream { versionProps.load(it) }
    }
    def propVersionCode = project.findProperty('versionCode') ?: versionProps.getProperty('versionCode', '4')
    def propVersionName = project.findProperty('versionName') ?: versionProps.getProperty('versionName', '1.2.1')
    versionCode propVersionCode.toString().toInteger()
    versionName propVersionName.toString()
        // 自动更新清单地址（不含文件名）。用 -PupdateBase=... 可指向自建/测试服务器
        buildConfigField "String", "UPDATE_BASE", "\"${project.findProperty('updateBase') ?: 'https://raw.githubusercontent.com/ai2tool/photoai/main/update'}\""
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // 签名只在本机进行：默认用 ~/.android/debug.keystore，
    // 需要时用 KEYSTORE_PATH / KEYSTORE_PASSWORD / KEYSTORE_ALIAS / KEY_PASSWORD 环境变量换成自己的发布密钥。
    def localDebugKeystore = file(System.getProperty("user.home") + "/.android/debug.keystore")
    def ciKeystorePath = System.getenv("KEYSTORE_PATH")
    signingConfigs {
        debug {
            if (localDebugKeystore.exists()) storeFile localDebugKeystore
        }
        if (ciKeystorePath) {
            ci {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEYSTORE_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ciKeystorePath ? signingConfigs.ci : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    aaptOptions {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // 自动更新：清单与 APK 下载
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 端侧 AI：人物分割（换背景）
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    // 端侧 AI：人脸检测（美颜定位 / 换脸对齐）
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
